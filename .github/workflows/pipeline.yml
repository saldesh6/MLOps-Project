name: Tourism Project Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlops-automated-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Stage 1 - Compile Production Packages
        run: pip install -r tourism_project/requirements.txt
        
      - name: Stage 2 - Execute Dataset Registration Schema
        run: |
          cp tourism_project/data/tourism.csv . || echo "Tracking package data fallback mapping clean"
          python tourism_project/model_building/data_register.py
          
      - name: Stage 3 - Process Partition Matrix Splits
        run: python tourism_project/model_building/prep.py
        
      - name: Stage 4 - Spawn Live Background MLflow UI Instance
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &
          sleep 5
          
      - name: Stage 5 - Hyperparameter Tuning & Training Execution
        run: python tourism_project/model_building/train.py
        
      - name: Stage 6 - Rebase-Safe Deployment Commit to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add tourism_project/deployment/best_model.joblib
          git commit -m "Update predictive model checkpoint binaries [skip ci]" || echo "Zero file variant transformations detected."
          git pull origin main --rebase || echo "Branch merge stream aligned."
          git push
